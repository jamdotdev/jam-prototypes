name: Publish prototypes

on:
  push:
    branches: [main]
    paths:
      - '2026-09-09 Jam for Mac (Martin)/**'
      - '2026-10-01 Jam for Mac (Chris)/**'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out prototypes
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare the static site
        run: |
          publish() {
            mkdir -p "_site/$2"
            cp "$1"/*.html "$1"/*.css "$1"/*.js "_site/$2/"
            cp -R "$1/assets" "_site/$2/assets"
          }
          publish '2026-09-09 Jam for Mac (Martin)' mac
          publish '2026-10-01 Jam for Mac (Chris)' mac-chris
          cp .github/pages/index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
